<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reinos de Hierro</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:Arial;overflow:hidden}header{height:58px;background:#1e293b;display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid #475569}h1{font-size:18px;color:#f4cf69;margin:0}.r{background:#0f172a;padding:8px;border-radius:7px}.right{margin-left:auto}button{background:#334155;color:white;border:1px solid #64748b;border-radius:7px;padding:8px;cursor:pointer}main{height:calc(100vh - 188px);position:relative}canvas{width:100%;height:100%;display:block;background:#496b3b}footer{height:130px;background:#111827;display:grid;grid-template-columns:240px 1fr 280px;border-top:1px solid #475569}.p{padding:10px;border-right:1px solid #334155;overflow:auto}.p h3{color:#f4cf69;font-size:12px;margin:0 0 8px}.cmds{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cmd{text-align:left;min-height:52px}.cmd small{display:block;color:#cbd5e1}.bar{height:7px;background:#334155}.bar i{display:block;height:100%;background:#22c55e}.tip{position:absolute;top:10px;right:10px;background:#0f172add;padding:10px;border-radius:8px;font-size:12px;line-height:1.4}.modal{display:none;position:absolute;inset:0;background:#020617dd;place-items:center;font-size:28px;z-index:5}.card{background:#111827;border:1px solid #64748b;padding:30px;border-radius:14px;text-align:center}@media(max-width:850px){.tip,.p:last-child{display:none}footer{grid-template-columns:190px 1fr}.cmds{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><h1>REINOS DE HIERRO</h1><span class="r">🌲 <b id="wood">0</b></span><span class="r">🍖 <b id="food">0</b></span><span class="r">🪨 <b id="stone">0</b></span><span class="r">🪙 <b id="gold">0</b></span><span class="r">👥 <b id="pop">0</b></span><span class="r">🏛️ <b id="age">Feudal</b></span><button class="right" id="pause">Pausar</button><button onclick="location.reload()">Reiniciar</button></header><main id="wrap"><canvas id="c"></canvas><div class="tip"><b>Controles</b><br>Arrastra: seleccionar<br>Clic derecho: mover/recolectar/atacar<br>WASD o flechas: cámara<br>Rueda: zoom</div><div class="modal" id="win"><div class="card">🏆 ¡Victoria!<br><button onclick="location.reload()">Jugar otra vez</button></div></div><div class="modal" id="lose"><div class="card">💀 Derrota<br><button onclick="location.reload()">Reintentar</button></div></div></main><footer><div class="p"><h3>SELECCIÓN</h3><div id="sel">Nada seleccionado</div></div><div class="p"><h3>ÓRDENES</h3><div class="cmds" id="cmds"></div></div><div class="p"><h3>CRÓNICA</h3><div id="log"></div></div></footer><script>'use strict';const cv=c,ct=cv.getContext('2d'),W={w:2600,h:1700},cam={x:180,y:500,z:1},S={wood:500,food:500,stone:300,gold:250,age:1,cap:15,ent:[],res:[],sel:[],shots:[],logs:[]};let id=1,last=performance.now(),paused=false,wave=0,nextWave=65,build=null,drag=null,keys={};const A=['Feudal','Castillos','Imperial'],T={villager:{n:'Aldeano',hp:55,r:8,s:72,a:4,rg:20,cd:1,c:{food:50},t:7,p:1,col:'#4ade80',g:1},militia:{n:'Milicia',hp:100,r:9,s:68,a:14,rg:22,cd:.9,c:{food:60,gold:20},t:9,p:1,col:'#60a5fa'},archer:{n:'Arquero',hp:65,r:8,s:70,a:11,rg:160,cd:1.3,c:{wood:35,gold:45},t:11,p:1,col:'#fbbf24',ranged:1},knight:{n:'Caballero',hp:180,r:12,s:95,a:26,rg:25,cd:1.1,c:{food:80,gold:70},t:14,p:2,col:'#c084fc',age:2},enemy:{n:'Saqueador',hp:110,r:9,s:62,a:13,rg:22,cd:1,p:0,col:'#ef4444'},enemyArcher:{n:'Arquero enemigo',hp:70,r:8,s:64,a:10,rg:150,cd:1.4,p:0,col:'#fb7185',ranged:1},town:{n:'Centro urbano',hp:1200,w:84,h:84,col:'#d6b37a',b:1,cap:5,tr:['villager']},house:{n:'Casa',hp:350,w:54,h:48,col:'#e4bd78',b:1,cap:5,c:{wood:100},bt:7},barracks:{n:'Cuartel',hp:700,w:72,h:58,col:'#9ca3af',b:1,c:{wood:175,stone:50},bt:12,tr:['militia']},range:{n:'Galería de tiro',hp:620,w:70,h:56,col:'#b08968',b:1,c:{wood:200,gold:50},bt:13,tr:['archer']},stable:{n:'Establo',hp:760,w:76,h:58,col:'#a78bfa',b:1,c:{wood:220,stone:80},bt:16,tr:['knight'],age:2},tower:{n:'Torre',hp:850,w:44,h:44,col:'#94a3b8',b:1,c:{stone:180,wood:60},bt:14,a:18,rg:220,cd:1.4,ranged:1},castle:{n:'Castillo',hp:2400,w:108,h:94,col:'#64748b',b:1,a:28,rg:250,cd:1.1,ranged:1},wonder:{n:'Maravilla',hp:1800,w:100,h:100,col:'#f59e0b',b:1,c:{wood:800,stone:800,gold:600},bt:38,age:3,wonder:1}};function E(type,x,y,team='p',extra={}){let d=T[type],e={id:id++,type,x,y,team,hp:d.hp,max:d.hp,alive:1,order:null,target:null,cd:0,q:[],prog:0,built:extra.built??1,bp:extra.built===false?0:1,...extra};S.ent.push(e);return e}function R(type,x,y){S.res.push({id:id++,type,x,y,amt:650,r:type==='tree'?18:16})}function log(t){S.logs.unshift(t);S.logs=S.logs.slice(0,7);document.getElementById('log').innerHTML=S.logs.map(x=>'<div>'+x+'</div>').join('')}function seed(){E('town',500,760);for(let i=0;i<4;i++)E('villager',430+i*45,710+(i%2)*90);E('castle',2200,800,'e');for(let i=0;i<6;i++)E(i%3?'enemy':'enemyArcher',2080+Math.random()*220,650+Math.random()*300,'e');for(let i=0;i<65;i++)R('tree',100+Math.random()*2400,100+Math.random()*1450);for(let i=0;i<20;i++)R('stone',250+Math.random()*2100,180+Math.random()*1300);for(let i=0;i<18;i++)R('gold',250+Math.random()*2100,180+Math.random()*1300);for(let i=0;i<18;i++)R('berry',250+Math.random()*1900,180+Math.random()*1300);log('Tu reino despierta. Reúne recursos y conquista el castillo.')}function resize(){let r=wrap.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;cv.style.width=r.width+'px';cv.style.height=r.height+'px'}addEventListener('resize',resize);resize();function sw(x,y){return{x:x/cam.z+cam.x,y:y/cam.z+cam.y}}function near(a,x,y,m=1e9){let b=null,bd=m*m;for(let o of a){if(o.alive===0)continue;let d=(o.x-x)**2+(o.y-y)**2;if(d<bd)bd=d,b=o}return b}function pay(c){for(let k in c)S[k]-=c[k]}function can(c){return Object.entries(c||{}).every(([k,v])=>S[k]>=v)}function cost(c){return Object.entries(c||{}).map(([k,v])=>(k==='wood'?'🌲':k==='food'?'🍖':k==='stone'?'🪨':'🪙')+v).join(' ')}function used(){return S.ent.filter(e=>e.alive&&e.team==='p'&&!T[e.type].b).reduce((n,e)=>n+(T[e.type].p||0),0)+S.ent.reduce((n,e)=>n+e.q.reduce((z,t)=>z+(T[t].p||0),0),0)}function cap(){S.cap=5+S.ent.filter(e=>e.alive&&e.team==='p'&&e.built).reduce((n,e)=>n+(T[e.type].cap||0),0)}function clear(){S.sel=[]}function renderSel(){if(!S.sel.length){sel.textContent='Nada seleccionado';cmds.innerHTML='';return}let e=S.sel[0],d=T[e.type];sel.innerHTML='<b>'+(S.sel.length>1?S.sel.length+' unidades':d.n)+'</b><p>Vida '+Math.ceil(e.hp)+'/'+e.max+'</p><div class="bar"><i style="width:'+(e.hp/e.max*100)+'%"></i></div>';let arr=[];if(d.g)for(let t of ['house','barracks','range','stable','tower','wonder']){let q=T[t];if(!q.age||S.age>=q.age)arr.push(['Construir '+q.n,cost(q.c),()=>{if(can(q.c)){build=t}else alert('Recursos insuficientes')}])}if(d.tr)for(let t of d.tr){let q=T[t];if(!q.age||S.age>=q.age)arr.push(['Crear '+q.n,cost(q.c),()=>train(e,t)])}if(e.type==='town'&&S.age<3)arr.push(['Avanzar de edad',S.age===1?'🍖500 🪙300':'🍖800 🪙600 🪨300',advance]);cmds.innerHTML='';for(let a of arr){let b=document.createElement('button');b.className='cmd';b.innerHTML='<b>'+a[0]+'</b><small>'+a[1]+'</small>';b.onclick=a[2];cmds.appendChild(b)}}function train(e,t){let d=T[t];if(!can(d.c))return alert('Recursos insuficientes');if(used()+d.p>S.cap)return alert('Construye casas');pay(d.c);e.q.push(t)}function advance(){let c=S.age===1?{food:500,gold:300}:{food:800,gold:600,stone:300};if(!can(c))return alert('Recursos insuficientes');pay(c);S.age++;log('Has avanzado a la Edad de '+A[S.age-1]);renderSel()}cv.onmousedown=e=>{if(e.button!==0)return;let r=cv.getBoundingClientRect(),p=sw(e.clientX-r.left,e.clientY-r.top);if(build){let d=T[build];if(!can(d.c))return;pay(d.c);let b=E(build,p.x,p.y,'p',{built:false});let v=S.sel.find(x=>T[x.type].g);if(v)v.order='build',v.target=b;log('Construcción iniciada: '+d.n);build=null;return}drag={sx:e.clientX-r.left,sy:e.clientY-r.top,ex:e.clientX-r.left,ey:e.clientY-r.top}};cv.onmousemove=e=>{if(drag){let r=cv.getBoundingClientRect();drag.ex=e.clientX-r.left;drag.ey=e.clientY-r.top}};cv.onmouseup=e=>{if(!drag)return;let a=sw(drag.sx,drag.sy),b=sw(drag.ex,drag.ey);clear();if(Math.hypot(drag.ex-drag.sx,drag.ey-drag.sy)>8)S.sel=S.ent.filter(x=>x.alive&&x.team==='p'&&!T[x.type].b&&x.x>Math.min(a.x,b.x)&&x.x<Math.max(a.x,b.x)&&x.y>Math.min(a.y,b.y)&&x.y<Math.max(a.y,b.y));else{let q=near(S.ent.filter(x=>x.alive&&x.team==='p'),b.x,b.y,35);if(q)S.sel=[q]}drag=null;renderSel()};cv.oncontextmenu=e=>{e.preventDefault();let r=cv.getBoundingClientRect(),p=sw(e.clientX-r.left,e.clientY-r.top),foe=near(S.ent.filter(x=>x.alive&&x.team==='e'),p.x,p.y,35),res=near(S.res.filter(x=>x.amt>0),p.x,p.y,28);S.sel.filter(x=>!T[x.type].b).forEach((x,i)=>{x.order=foe?'attack':res&&T[x.type].g?'gather':'move';x.target=foe||res||{x:p.x+i%4*18,y:p.y+Math.floor(i/4)*18}})};cv.onwheel=e=>{e.preventDefault();cam.z=Math.max(.55,Math.min(1.6,cam.z*(e.deltaY<0?1.1:.9)))},{passive:false};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Continuar':'Pausar'};function go(e,t,dt,stop){let dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy);if(d<=stop)return 1;let m=Math.min(d-stop,T[e.type].s*dt);e.x+=dx/d*m;e.y+=dy/d*m}function hit(t,a){t.hp-=a;if(t.hp<=0){t.alive=0;if(t.type==='castle')win.style.display='grid';if(t.type==='town')lose.style.display='grid'}}function shoot(e,t,a){S.shots.push({x:e.x,y:e.y,t,a,l:.35})}function updE(e,dt){let d=T[e.type];e.cd=Math.max(0,e.cd-dt);if(d.b&&e.built){if(e.q.length){e.prog+=dt;if(e.prog>=T[e.q[0]].t){let t=e.q.shift();e.prog=0;E(t,e.x+(d.w||50)/2+25,e.y+20,e.team);log(T[t].n+' preparado')}}if(d.a){let t=near(S.ent.filter(x=>x.alive&&x.team!==e.team),e.x,e.y,d.rg);if(t&&e.cd<=0)shoot(e,t,d.a),e.cd=d.cd}return}if(!e.built)return;if(e.order==='move'&&go(e,e.target,dt,4))e.order=null;else if(e.order==='gather'){if(e.target.amt<=0)return e.order=null;if(go(e,e.target,dt,e.target.r+10)){e.tick=(e.tick||0)+dt;if(e.tick>=1){e.tick=0;let k=e.target.type==='tree'?'wood':e.target.type==='berry'?'food':e.target.type;e.target.amt-=10;S[k]+=10}}}else if(e.order==='build'){if(go(e,e.target,dt,45)){e.target.bp+=dt/T[e.target.type].bt;e.target.hp=Math.max(1,e.target.max*e.target.bp);if(e.target.bp>=1)e.target.built=1,e.target.hp=e.target.max,e.order=null,log(T[e.target.type].n+' terminado')}}else if(e.order==='attack'){if(!e.target.alive)return e.order=null;if(go(e,e.target,dt,d.rg)){if(e.cd<=0)d.ranged?shoot(e,e.target,d.a):hit(e.target,d.a),e.cd=d.cd}}if(e.team==='e'&&!e.order){let t=near(S.ent.filter(x=>x.alive&&x.team==='p'),e.x,e.y,900);if(t)e.order='attack',e.target=t}}function update(dt){let sp=350/cam.z;if(keys.w||keys.arrowup)cam.y-=sp*dt;if(keys.s||keys.arrowdown)cam.y+=sp*dt;if(keys.a||keys.arrowleft)cam.x-=sp*dt;if(keys.d||keys.arrowright)cam.x+=sp*dt;cam.x=Math.max(0,Math.min(W.w-cv.clientWidth/cam.z,cam.x));cam.y=Math.max(0,Math.min(W.h-cv.clientHeight/cam.z,cam.y));for(let e of S.ent)if(e.alive)updE(e,dt);for(let p of S.shots){p.l-=dt;p.x+=(p.t.x-p.x)*dt*9;p.y+=(p.t.y-p.y)*dt*9;if(p.l<=0&&p.t.alive)hit(p.t,p.a)}S.shots=S.shots.filter(x=>x.l>0);nextWave-=dt;if(nextWave<=0){wave++;nextWave=Math.max(36,72-wave*4);for(let i=0;i<3+wave;i++){let e=E(i%3?'enemy':'enemyArcher',2200+Math.random()*100,700+Math.random()*200,'e');e.order='attack';e.target=near(S.ent.filter(x=>x.alive&&x.team==='p'&&T[x.type].b),500,760)}log('Oleada enemiga '+wave)}cap();wood.textContent=Math.floor(S.wood);food.textContent=Math.floor(S.food);stone.textContent=Math.floor(S.stone);gold.textContent=Math.floor(S.gold);pop.textContent=used()+'/'+S.cap;age.textContent=A[S.age-1]}function draw(){let d=devicePixelRatio;ct.setTransform(d,0,0,d,0,0);ct.clearRect(0,0,cv.clientWidth,cv.clientHeight);ct.save();ct.scale(cam.z,cam.z);ct.translate(-cam.x,-cam.y);ct.fillStyle='#496b3b';ct.fillRect(0,0,W.w,W.h);ct.fillStyle='#88afbf';ct.fillRect(0,1380,W.w,320);for(let r of S.res)if(r.amt>0){ct.save();ct.translate(r.x,r.y);if(r.type==='tree'){ct.fillStyle='#5b3a29';ct.fillRect(-4,3,8,18);ct.fillStyle='#176b37';ct.beginPath();ct.arc(0,-5,16,0,7);ct.fill()}else{ct.fillStyle=r.type==='gold'?'#d4a72c':r.type==='stone'?'#9ca3af':'#8b5cf6';ct.beginPath();ct.moveTo(-14,10);ct.lineTo(-7,-12);ct.lineTo(10,-10);ct.lineTo(15,10);ct.fill()}ct.restore()}for(let e of S.ent)if(e.alive){let q=T[e.type];ct.save();ct.translate(e.x,e.y);if(S.sel.includes(e)){ct.strokeStyle='#fde047';ct.beginPath();ct.arc(0,0,(q.w||q.r*2)/2+8,0,7);ct.stroke()}if(q.b){ct.fillStyle=q.col;ct.fillRect(-q.w/2,-q.h/2,q.w,q.h);ct.strokeStyle=e.team==='e'?'#7f1d1d':'#3f3328';ct.strokeRect(-q.w/2,-q.h/2,q.w,q.h);if(!e.built){ct.fillStyle='#111a';ct.fillRect(-q.w/2,-q.h/2,q.w,q.h*(1-e.bp))}}else{ct.fillStyle=q.col;ct.beginPath();ct.arc(0,0,q.r,0,7);ct.fill();ct.strokeStyle=e.team==='e'?'#7f1d1d':'#111827';ct.stroke()}if(e.hp<e.max||e.team==='e'){let w=q.w||q.r*2;ct.fillStyle='#111';ct.fillRect(-w/2,-(q.h||q.r*2)/2-9,w,5);ct.fillStyle=e.team==='e'?'#ef4444':'#22c55e';ct.fillRect(-w/2,-(q.h||q.r*2)/2-9,w*e.hp/e.max,5)}ct.restore()}for(let p of S.shots){ct.fillStyle='#fff59d';ct.beginPath();ct.arc(p.x,p.y,3,0,7);ct.fill()}ct.restore();if(drag){ct.strokeStyle='#fde047';ct.strokeRect(drag.sx,drag.sy,drag.ex-drag.sx,drag.ey-drag.sy)}}function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(!paused)update(dt);draw();requestAnimationFrame(loop)}seed();cap();update(.01);requestAnimationFrame(loop)</script></body></html>
